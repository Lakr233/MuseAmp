name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for all platforms
        run: make build

      - name: Run Tests
        run: make test-unit

      - name: Format and Lint Check
        run: make format-lint

      # xcbeautify keeps the live log short, so a failed or crashed test is
      # only fully described in the result bundle and the crash report.
      - name: Collect test results
        if: failure()
        run: |
          mkdir -p test-results
          cp -R /private/tmp/museamp-deriveddata/Logs/Test/*.xcresult test-results/ || true
          cp ~/Library/Logs/DiagnosticReports/MuseAmp* test-results/ || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
